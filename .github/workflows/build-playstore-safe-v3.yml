name: Build Barra Kimia Termal - Safe v1.0.2

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find Android project ZIP
        shell: bash
        run: |
          if [ -f "Barra-Kimia-Termal-PlayStore-GitHub-Safe-v3.zip" ]; then
            ZIP_FILE="Barra-Kimia-Termal-PlayStore-GitHub-Safe-v3.zip"
          elif [ -f "Barra-Kimia-Termal-PlayStore-GitHub-Fixed.zip" ]; then
            ZIP_FILE="Barra-Kimia-Termal-PlayStore-GitHub-Fixed.zip"
          elif [ -f "Barra-Kimia-Termal-PlayStore-GitHub.zip" ]; then
            ZIP_FILE="Barra-Kimia-Termal-PlayStore-GitHub.zip"
          else
            echo "Project ZIP tidak ditemukan di root repository."
            exit 1
          fi
          echo "PROJECT_ZIP=$ZIP_FILE" >> "$GITHUB_ENV"
          echo "Menggunakan: $ZIP_FILE"

      - name: Extract Android project
        shell: bash
        run: |
          rm -rf android-project
          mkdir -p android-project
          unzip -q "$PROJECT_ZIP" -d android-project
          test -f android-project/settings.gradle.kts || { echo "settings.gradle.kts tidak ditemukan"; exit 1; }
          test -f android-project/build.gradle.kts || { echo "build.gradle.kts tidak ditemukan"; exit 1; }
          test -f android-project/app/build.gradle.kts || { echo "app/build.gradle.kts tidak ditemukan"; exit 1; }

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Restore upload keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "Missing ANDROID_KEYSTORE_BASE64"; exit 1; }
          KEYSTORE_PATH="$RUNNER_TEMP/barra-kimia-upload-key.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          echo "RELEASE_STORE_FILE=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Build Debug APK + signed Release APK/AAB
        shell: bash
        working-directory: android-project
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          gradle --no-daemon clean assembleDebug assembleRelease bundleRelease

      - name: Verify AAB signature
        shell: bash
        run: jarsigner -verify android-project/app/build/outputs/bundle/release/app-release.aab

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Barra-Kimia-Termal-Debug-APK-v1.0.2
          path: android-project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Barra-Kimia-Termal-Release-APK-v1.0.2
          path: android-project/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload signed Play Store AAB
        uses: actions/upload-artifact@v4
        with:
          name: Barra-Kimia-Termal-PlayStore-AAB-v1.0.2
          path: android-project/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30
